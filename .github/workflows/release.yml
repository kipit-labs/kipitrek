# Merging a change of VERSION (a release PR) into main tags that commit 1.2.3
# and publishes ghcr.io/kipit-labs/kipitrek:1.2.3 and :latest for amd64 and
# arm64, with the GitHub release. Deploying it is an image bump in the
# homelab ops repo.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, to check the new version against
      - name: Tag
        id: tag
        run: |
          v=$(cat VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # A re-run finds its own tag.
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            test "$(git rev-list -n1 "$v")" = "$GITHUB_SHA" || { echo "::error::tag $v is on another commit"; exit 1; }
            exit 0
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION $v is not X.Y.Z"; exit 1; }
          last=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          test "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" = "$v" || { echo "::error::$v is not above $last"; exit 1; }
          git tag "$v" && git push origin "$v"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/kipit-labs/kipitrek:${{ steps.tag.outputs.version }}
            ghcr.io/kipit-labs/kipitrek:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.version }}" --generate-notes --verify-tag
